<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConvertiaX - Inicio</title>
    <!-- Redirigir a convertia.html o crear un menú principal -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f5;
            color: #18181b;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 250px;
            text-align: center;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        .card h2 {
            margin-top: 0;
            color: #2563eb;
        }
        .card p {
            color: #52525b;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <h1>Bienvenido a ConvertiaX</h1>
    <div class="container">
        <a href="convertia.html" class="card">
            <h2>Convertia</h2>
            <p>Ir a la página principal de Convertia</p>
        </a>
        <a href="convertia-prompts.html" class="card">
            <h2>Prompts</h2>
            <p>Explorar la sección de Prompts</p>
        </a>
    </div>
</body>
</html>
